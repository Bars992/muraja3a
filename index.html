<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Muraja'a — Révision du Coran</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#edf1ef; --card:#ffffff; --ink:#14231f; --mute:#62746d; --line:#d8e0dc;
  --accent:#0d6a55; --accent-soft:#d9efe8; --on-accent:#ffffff;
  --late:#b3261e; --late-soft:#fbe3e0; --due:#9a6200; --due-soft:#fdf0d4;
  --err:#c62828;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1815; --card:#16231f; --ink:#e6f0ec; --mute:#92a69e; --line:#27382f;
    --accent:#3fc6a1; --accent-soft:#16372f; --on-accent:#06231b;
    --late:#ff8a80; --late-soft:#3a1c19; --due:#f2c066; --due-soft:#35290f;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1815; --card:#16231f; --ink:#e6f0ec; --mute:#92a69e; --line:#27382f;
  --accent:#3fc6a1; --accent-soft:#16372f; --on-accent:#06231b;
  --late:#ff8a80; --late-soft:#3a1c19; --due:#f2c066; --due-soft:#35290f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:#faf8f4;color:var(--ink);font-family:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.45;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ar{font-family:'Amiri Quran','Scheherazade New','Traditional Arabic',serif}

/* ===== Lecteur (style mushaf) ===== */
#reader{position:fixed;inset:0;display:flex;flex-direction:column;background:#faf8f4;color:#111;padding-top:env(safe-area-inset-top,0px)}
.hd{display:flex;align-items:center;gap:4px;padding:8px 6px 8px 6px;background:#faf8f4}
.hb{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none}
.hb svg{width:26px;height:26px}
.tb{flex:1;min-width:0;background:#ececec;border-radius:8px;border:1px solid #dcdcdc;padding:7px 12px;display:flex;align-items:center;justify-content:space-between;text-align:left;gap:8px}
.tb b{display:block;font-size:19px;font-weight:500;line-height:1.2}
.tb small{display:block;font-size:14px;color:#222;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb svg{width:34px;height:34px;color:#9b9b9b;flex:none}
.lbar{display:flex;align-items:center;gap:10px;background:#fbe3e0;color:#8f1d16;padding:9px 14px;font-size:14px;font-weight:600}
.lbar span{flex:1}
.lbar button{background:#b3261e;color:#fff;border-radius:10px;padding:8px 14px;min-height:40px;font-weight:600}
.pagewrap{flex:1;overflow:auto;padding:6px 8px 12px;position:relative}
.pagewrap::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;border-left:1px solid #d6d3cc;border-right:1px solid #d6d3cc}
#mush{max-width:520px;margin:0 auto;direction:rtl;color:#111}
.ln{display:flex;white-space:nowrap;align-items:center}
.ln.j{justify-content:space-between}
.ln.c{justify-content:center;gap:.4em}
.ln.hl{border-bottom:1px solid #ebe8e1}
.w{padding:0 .03em}
.w.hid,.w.hid span{color:transparent!important;user-select:none}
.w.hid{cursor:pointer}
.w.hid.cur{background:linear-gradient(#0d6a55,#0d6a55) no-repeat 0 82%/100% 3px;animation:pulse 1.3s ease-in-out infinite}
.w.err{background:linear-gradient(#c62828,#c62828) no-repeat 0 88%/100% 2px}
.mk{display:inline-flex;align-items:center;justify-content:center;flex:none;width:1.75em;height:1.75em;font-size:.5em;border:1.5px solid #222;border-radius:50%;margin:0 .45em;font-family:'Amiri Quran',serif;line-height:1;box-shadow:0 0 0 2px #faf8f4,0 0 0 3px #bbb}
.mk.err{border-color:#c62828;color:#c62828}
@keyframes pulse{50%{opacity:.35}}
/* tajwid */
.t-mn{color:#f08a00}.t-mj{color:#e0218a}.t-mw{color:#d3166f}.t-ml{color:#a8002f}
.t-g{color:#1e9e4b}.t-q{color:#1e5bd8}.t-ik{color:#0e9aa7}.t-iq{color:#00b8d4}.t-sl{color:#b0b0b0}

.strip{display:flex;align-items:center;gap:8px;padding:6px 12px;background:#faf8f4;border-top:1px solid #ebe8e1}
.strip .st{flex:1;font-size:14.5px;color:#444;min-width:0}
.strip .st b{color:#111}
.sq{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.sq svg{width:22px;height:22px}
.sq.ok{background:#0d6a55;color:#fff}
.sq.no{color:#c62828}
.bar{display:flex;align-items:center;gap:6px;padding:8px 10px calc(14px + env(safe-area-inset-bottom,0px));background:#faf8f4}
.pill{background:#fff;border-radius:99px;min-height:50px;padding:0 20px;font-weight:600;font-size:17px;display:flex;align-items:center;box-shadow:0 1px 5px rgba(0,0,0,.2);color:#111;flex:none}
.pill.has{color:#c62828}
.round{width:50px;height:50px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 1px 5px rgba(0,0,0,.2);color:#111;flex:none}
.round svg{width:24px;height:24px}
.round.sm{border:1.5px solid #888;box-shadow:none;background:transparent}
.mic{margin-inline-start:auto;width:66px;height:66px;border-radius:50%;background:linear-gradient(135deg,#59dca8,#9be36b);display:grid;place-items:center;color:#fff;box-shadow:0 6px 18px rgba(60,200,140,.5);flex:none}
.mic svg{width:32px;height:32px}
.mic.live{animation:ring 1s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(60,200,140,.6)}100%{box-shadow:0 0 0 20px rgba(60,200,140,0)}}
@media (max-width:400px){
  .round{width:42px;height:42px}.round svg{width:21px;height:21px}
  .pill{padding:0 13px;font-size:15px;min-height:44px}
  .mic{width:56px;height:56px}.mic svg{width:27px;height:27px}
  .bar{gap:5px}
}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(98px + env(safe-area-inset-bottom,0px));background:#16181a;color:#fff;padding:12px 18px;border-radius:10px;font-size:16px;z-index:60;max-width:90%;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:.96}

/* ===== Overlays (menu, feuilles) ===== */
#overlay{position:fixed;inset:0;z-index:30;display:none}
#overlay.on{display:block}
.backdrop{position:absolute;inset:0;background:rgba(5,20,15,.55)}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:480px;background:var(--card);color:var(--ink);border-radius:22px 22px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.drawer{position:absolute;left:0;top:0;bottom:0;width:min(90%,380px);background:var(--bg);color:var(--ink);overflow:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(24px + env(safe-area-inset-bottom,0px));animation:in .22s ease-out}
@keyframes in{from{transform:translateX(-30px);opacity:0}to{transform:none;opacity:1}}
.dh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.dh b{font-size:24px}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--card)}
.iconbtn svg{width:22px;height:22px}
h3{margin:0 0 4px;font-size:20px}
h2{font-size:15px;margin:20px 2px 8px;font-weight:600}
.sheet p{color:var(--mute);margin:4px 0 14px;font-size:14.5px}
.alert{display:flex;gap:10px;background:var(--late-soft);color:var(--late);border:1.5px solid var(--late);border-radius:14px;padding:12px;margin:10px 0;font-size:14px}
.alert b{display:block;font-size:15px}
.alert span{color:var(--ink)}
.p{background:var(--card);border-radius:16px;padding:13px;margin-bottom:10px;border-inline-start:5px solid var(--accent)}
.p.late{border-inline-start-color:var(--late)}
.p.due{border-inline-start-color:var(--due)}
.p-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.p-title{font-weight:600;font-size:16.5px}
.p-meta{color:var(--mute);font-size:13px}
.chip{font-size:12.5px;font-weight:600;padding:4px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.late{background:var(--late-soft);color:var(--late)}
.chip.due{background:var(--due-soft);color:var(--due)}
.p-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:8px}
.dots{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.dots small{margin-inline-start:6px;color:var(--mute);font-size:12.5px}
.btn{background:var(--accent);color:var(--on-accent);font-weight:600;padding:10px 18px;border-radius:12px;min-height:44px}
.btn.alt{background:var(--accent-soft);color:var(--accent)}
.btn.ghost{background:transparent;color:var(--mute);padding:8px 10px;min-height:40px}
.btn.late{background:var(--late);color:#fff}
.btn.off{opacity:.45}
.btn.wide{width:100%;margin-top:6px}
.empty{background:var(--card);border:1.5px dashed var(--line);border-radius:16px;padding:20px;text-align:center;color:var(--mute)}
details.demo{margin-top:18px;background:var(--card);border-radius:14px;padding:12px 14px}
details.demo summary{font-weight:600;cursor:pointer}
.demo-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.demo p{color:var(--mute);font-size:13.5px;margin:10px 0 0}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
select{width:100%;font:inherit;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);min-height:48px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:10px;margin-top:20px}
.actions .btn{flex:1}
.res{text-align:center}
.res .big{font-size:44px;font-weight:700;color:var(--accent);line-height:1.1}
.errs{max-height:50vh;overflow:auto}
.errs .e{padding:12px;border-radius:12px;background:var(--late-soft);margin-bottom:8px;direction:rtl;font-size:22px;line-height:1.9}
.errs .e small{display:block;direction:ltr;font-family:'Figtree',sans-serif;color:var(--late);font-size:12.5px;font-weight:600}
.pg{display:flex;justify-content:space-between;align-items:center;width:100%;padding:14px;border-radius:14px;background:var(--bg);margin-bottom:8px;text-align:left}
.pg.on{outline:2px solid var(--accent)}
.pg b{font-size:16.5px}.pg small{color:var(--mute);display:block;font-size:13px}
.pg .ar{font-size:24px}
.lg{display:flex;align-items:center;gap:12px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:15px}
.lg:last-child{border:0}
.sw{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:'Amiri Quran',serif;font-size:20px;background:#faf8f4}
.lg small{display:block;color:var(--mute);font-size:12.5px}
.list-late{margin:10px 0 0;padding:0;list-style:none}
.list-late li{display:flex;justify-content:space-between;padding:10px 12px;background:var(--late-soft);border-radius:10px;margin-bottom:6px;font-weight:600;color:var(--late)}
.w.bad,.w.bad span{color:#c62828!important}
input[type=search]{width:100%;font:inherit;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);min-height:48px}
#heard{font-family:'Amiri Quran',serif;font-size:19px;direction:rtl;unicode-bidi:plaintext}
.pg small{font-size:12.5px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="reader"></div>
<div id="overlay"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ============ Données du mushaf ============ */
const PAGES = {
  tur: { name:'At-Tur', ar:'الطور', page:524, juz:27, hizb:53, justify:true, raw:[
    'أَفَسِحْرٌ هَٰذَا أَمْ أَنتُمْ لَا تُبْصِرُونَ |15| ٱصْلَوْهَا فَٱصْبِرُوٓا۟',
    'أَوْ لَا تَصْبِرُوا۟ سَوَآءٌ عَلَيْكُمْ ۖ إِنَّمَا تُجْزَوْنَ مَا كُنتُمْ تَعْمَلُونَ |16|',
    'إِنَّ ٱلْمُتَّقِينَ فِى جَنَّـٰتٍ وَنَعِيمٍ |17| فَـٰكِهِينَ بِمَآ ءَاتَىٰهُمْ رَبُّهُمْ',
    'وَوَقَىٰهُمْ رَبُّهُمْ عَذَابَ ٱلْجَحِيمِ |18| كُلُوا۟ وَٱشْرَبُوا۟ هَنِيٓـًٔۢا بِمَا',
    'كُنتُمْ تَعْمَلُونَ |19| مُتَّكِـِٔينَ عَلَىٰ سُرُرٍ مَّصْفُوفَةٍ ۖ وَزَوَّجْنَـٰهُم',
    'بِحُورٍ عِينٍ |20| وَٱلَّذِينَ ءَامَنُوا۟ وَٱتَّبَعَتْهُمْ ذُرِّيَّتُهُم بِإِيمَـٰنٍ أَلْحَقْنَا',
    'بِهِمْ ذُرِّيَّتَهُمْ وَمَآ أَلَتْنَـٰهُم مِّنْ عَمَلِهِم مِّن شَىْءٍ ۚ كُلُّ ٱمْرِئٍۭ بِمَا كَسَبَ',
    'رَهِينٌ |21| وَأَمْدَدْنَـٰهُم بِفَـٰكِهَةٍ وَلَحْمٍ مِّمَّا يَشْتَهُونَ |22| يَتَنَـٰزَعُونَ',
    'فِيهَا كَأْسًا لَّا لَغْوٌ فِيهَا وَلَا تَأْثِيمٌ |23| وَيَطُوفُ عَلَيْهِمْ غِلْمَانٌ',
    'لَّهُمْ كَأَنَّهُمْ لُؤْلُؤٌ مَّكْنُونٌ |24| وَأَقْبَلَ بَعْضُهُمْ عَلَىٰ بَعْضٍ يَتَسَآءَلُونَ',
    '|25| قَالُوٓا۟ إِنَّا كُنَّا قَبْلُ فِىٓ أَهْلِنَا مُشْفِقِينَ |26| فَمَنَّ ٱللَّهُ',
    'عَلَيْنَا وَوَقَىٰنَا عَذَابَ ٱلسَّمُومِ |27| إِنَّا كُنَّا مِن قَبْلُ',
    'نَدْعُوهُ ۖ إِنَّهُۥ هُوَ ٱلْبَرُّ ٱلرَّحِيمُ |28| فَذَكِّرْ فَمَآ أَنتَ بِنِعْمَتِ',
    'رَبِّكَ بِكَاهِنٍ وَلَا مَجْنُونٍ |29| أَمْ يَقُولُونَ شَاعِرٌ نَّتَرَبَّصُ بِهِۦ رَيْبَ',
    'ٱلْمَنُونِ |30| قُلْ تَرَبَّصُوا۟ فَإِنِّى مَعَكُم مِّنَ ٱلْمُتَرَبِّصِينَ |31|'
  ]},
  fatiha: { name:'Al-Fatiha', ar:'الفاتحة', page:1, juz:1, hizb:1, justify:false, raw:[
    'بِسْمِ ٱللَّهِ ٱلرَّحْمَـٰنِ ٱلرَّحِيمِ |1|',
    'ٱلْحَمْدُ لِلَّهِ رَبِّ ٱلْعَـٰلَمِينَ |2|',
    'ٱلرَّحْمَـٰنِ ٱلرَّحِيمِ |3| مَـٰلِكِ يَوْمِ ٱلدِّينِ |4|',
    'إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ |5|',
    'ٱهْدِنَا ٱلصِّرَٰطَ ٱلْمُسْتَقِيمَ |6|',
    'صِرَٰطَ ٱلَّذِينَ أَنْعَمْتَ عَلَيْهِمْ',
    'غَيْرِ ٱلْمَغْضُوبِ عَلَيْهِمْ وَلَا ٱلضَّآلِّينَ |7|'
  ]},
  ikhlas: { name:'Al-Ikhlas', ar:'الإخلاص', page:604, juz:30, hizb:60, justify:false, raw:[
    'قُلْ هُوَ ٱللَّهُ أَحَدٌ |1|',
    'ٱللَّهُ ٱلصَّمَدُ |2|',
    'لَمْ يَلِدْ وَلَمْ يُولَدْ |3|',
    'وَلَمْ يَكُن لَّهُۥ كُفُوًا أَحَدٌۢ |4|'
  ]},
  falaq: { name:'Al-Falaq', ar:'الفلق', page:604, juz:30, hizb:60, justify:false, raw:[
    'قُلْ أَعُوذُ بِرَبِّ ٱلْفَلَقِ |1|',
    'مِن شَرِّ مَا خَلَقَ |2|',
    'وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ |3|',
    'وَمِن شَرِّ ٱلنَّفَّـٰثَـٰتِ فِى ٱلْعُقَدِ |4|',
    'وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ |5|'
  ]},
  nas: { name:'An-Nas', ar:'الناس', page:604, juz:30, hizb:60, justify:false, raw:[
    'قُلْ أَعُوذُ بِرَبِّ ٱلنَّاسِ |1|',
    'مَلِكِ ٱلنَّاسِ |2|',
    'إِلَـٰهِ ٱلنَّاسِ |3|',
    'مِن شَرِّ ٱلْوَسْوَاسِ ٱلْخَنَّاسِ |4|',
    'ٱلَّذِى يُوَسْوِسُ فِى صُدُورِ ٱلنَّاسِ |5|',
    'مِنَ ٱلْجِنَّةِ وَٱلنَّاسِ |6|'
  ]}
};

/* ============ Tajwid : analyse par règles (approximation) ============ */
const MARK = /[\u064B-\u065F\u0670\u06D6-\u06DC\u06DF-\u06E8\u06EA-\u06ED]/;
const HARAKA = /[\u064B-\u0650]/, SUKUN = /[\u0652\u06E1]/, TANWEEN = /[\u064B\u064C\u064D]/;
const HAMZA = 'ءأإؤئ';
function clusters(w){
  const out = [];
  for (const ch of w){
    if (MARK.test(ch) && out.length) out[out.length-1].s += ch;
    else out.push({ s: ch });
  }
  out.forEach(c => { c.b = c.s[0]; c.m = c.s.slice(1); c.nob = MARK.test(c.b); });
  return out;
}
const sakin = c => !HARAKA.test(c.m) && !/[\u0651\u0653\u0670\u06E5\u06E6]/.test(c.m);

function tajweed(P){
  const seq = []; let last = null;
  P.lines.forEach(row => row.forEach(t => {
    if (t.m){ if (last) last.end = true; }
    else { t.c = clusters(t.w); t.end = false; seq.push(t); last = t; }
  }));
  const nx = (i,j) => {
    const w = seq[i];
    for (let k=j+1; k<w.c.length; k++) if (!w.c[k].nob) return { c:w.c[k], cross:false };
    if (w.end) return null;
    for (let k=i+1; k<seq.length; k++){
      const x = seq[k].c.find(c => !c.nob);
      if (x) return { c:x, cross:true };
      if (seq[k].end) return null;
    }
    return null;
  };
  const madd = (i,j) => {
    const w = seq[i], n = nx(i,j);
    if (n && !n.cross && n.c.m.includes('\u0651')) return 't-ml';
    if (n && !n.cross && HAMZA.includes(n.c.b)) return 't-mw';
    if (n && n.cross && HAMZA.includes(n.c.b) && j >= w.c.length-1) return 't-mj';
    return 't-mn';
  };
  seq.forEach((w,i) => {
    w.c.forEach((c,j) => {
      if (c.nob) return;
      const prev = j>0 ? w.c[j-1] : null;
      const n = nx(i,j);
      let cls = null;
      if (c.b === 'ٱ') cls = 't-sl';
      else if (c.b==='ل' && c.m==='' && prev && prev.b==='ٱ' && n && !n.cross && n.c.m.includes('\u0651')) cls = 't-sl';
      else if (c.b==='ا' && c.m.includes('\u06DF')) cls = 't-sl';
      else if (c.m.includes('\u0653')) cls = madd(i,j);
      else if (c.m.includes('\u0670') || /[\u06E5\u06E6]/.test(c.m)) cls = madd(i,j);
      else if (c.b==='ا' && c.m==='' && prev && /\u064E/.test(prev.m)) cls = madd(i,j);
      else if (c.b==='و' && c.m==='' && prev && /\u064F/.test(prev.m)) cls = madd(i,j);
      else if ((c.b==='ي' || c.b==='ى') && c.m==='' && prev && /\u0650/.test(prev.m)) cls = madd(i,j);
      else if ('قطبجد'.includes(c.b) && (SUKUN.test(c.m) || (w.end && j===w.c.length-1 && !HARAKA.test(c.m) && !c.m.includes('\u0651')))) cls = 't-q';
      else if ((c.b==='ن' || c.b==='م') && c.m.includes('\u0651')) cls = 't-g';
      else if ((c.b==='ن' && sakin(c)) || TANWEEN.test(c.m)){
        if (n && n.c.b !== 'ٱ'){
          const L = n.c.b;
          if (L === 'ب') cls = 't-iq';
          else if (n.cross && 'ينمولر'.includes(L)) cls = 't-g';
          else if ('تثجدذزسشصضطظفقك'.includes(L)) cls = 't-ik';
        }
      }
      else if (c.b==='م' && sakin(c) && n && n.cross){
        if (n.c.b === 'ب') cls = 't-ik';
        else if (n.c.b === 'م') cls = 't-g';
      }
      c.cls = cls;
    });
    w.h = w.c.map(c => c.cls ? `<span class="${c.cls}">${c.s}</span>` : c.s).join('');
  });
}

function buildPage(p){
  let pending = []; p.lines = []; const vs = {};
  p.raw.forEach(l => {
    const row = [];
    l.split(' ').forEach(w => {
      const m = w.match(/^\|(\d+)\|$/);
      if (m){ const n=+m[1]; pending.forEach(t=>t.v=n); pending=[]; row.push({m:n}); }
      else { const t={w,v:null}; pending.push(t); row.push(t); }
    });
    p.lines.push(row);
  });
  const cnt = {};
  p.lines.forEach(r => r.forEach(t => {
    if (t.w){ (vs[t.v] = vs[t.v]||[]).push(t.w); t.i = cnt[t.v] = (cnt[t.v]===undefined ? 0 : cnt[t.v]+1); }
  }));
  p.text = {}; for (const v in vs) p.text[v] = vs[v].join(' ');
  const keys = Object.keys(vs).map(Number);
  p.min = Math.min(...keys); p.max = Math.max(...keys);
  tajweed(p);
}

/* Mise en page automatique d'une sourate chargée (lignes d'environ 34 lettres) */
function buildSurah(n, d){
  const lines = []; let cur = [], cnt = 0;
  d.v.forEach(v => {
    v.w.forEach(w => {
      const len = w.replace(/[\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g,'').length + 1;
      if (cnt+len > 34 && cur.length){ lines.push(cur.join(' ')); cur = []; cnt = 0; }
      cur.push(w); cnt += len;
    });
    cur.push('|'+v.n+'|'); cnt += 3;
  });
  if (cur.length) lines.push(cur.join(' '));
  const s = SURAHS[n-1];
  const P = { name:s[0], ar:s[1], page:d.p, juz:d.j, hizb:d.h, justify:true, flow:true, raw:lines };
  PAGES[skey(n)] = P; buildPage(P);
  P.lines.forEach(r => r.last = false); P.lines[P.lines.length-1].last = true;
}
async function loadSurah(n){
  const key = skey(n); if (PAGES[key]) return key;
  let d = lsGet(QK(n));
  if (!d){
    d = { v:[], p:null, j:null, h:null }; let page = 1;
    for (;;){
      const r = await fetch(`https://api.quran.com/api/v4/verses/by_chapter/${n}?words=true&word_fields=text_uthmani&per_page=50&page=${page}`);
      if (!r.ok) throw new Error('HTTP '+r.status);
      const j = await r.json();
      j.verses.forEach(v => {
        if (d.p === null){ d.p = v.page_number; d.j = v.juz_number; d.h = v.hizb_number; }
        d.v.push({ n:v.verse_number, w:v.words.filter(x => x.char_type_name==='word' || x.char_type_name==='pause').map(x => x.text_uthmani || x.text).filter(Boolean) });
      });
      const nx = j.pagination && j.pagination.next_page; if (!nx) break; page = nx;
    }
    if (!d.v.length) throw new Error('réponse vide');
    lsSet(QK(n), d);
  }
  buildSurah(n, d); return key;
}

      <button class="mic ${R.live?'live':''}" data-act="mic" aria-label="${R.live?'Arrêter le micro':'Réciter au micro'}">${I.mic}</button>

  R.fresh = false;

  if (R.hidden && !cur && R.revealed.size && !R.finishing){ R.finishing = true; setTimeout(showResult, 450); }
}
function fit(){
  const el = $('#mush'), wrap = $('.pagewrap'); if (!el) return;
  const P = PAGES[R.key], n = el.children.length, lns = [...el.children];
  let fs = P.justify ? 34 : 40; el.style.fontSize = fs+'px';
  const setH = () => {
    const avail = wrap.clientHeight - 24;
    const h = Math.min(Math.max(avail/n, fs*(P.flow?2.2:1.9)), fs*(P.justify?3.4:2.8));
    lns.forEach(l => l.style.height = h+'px');
  };
  const over = l => l.scrollWidth > l.clientWidth+1;
  setH();
  let worst = 1;
  lns.forEach(l => { if (over(l)) worst = Math.min(worst, l.clientWidth/l.scrollWidth); });
  if (worst < 1){ fs = Math.max(11, Math.floor(fs*worst*.98*2)/2); el.style.fontSize = fs+'px'; setH(); }
  let g = 0;
  while (g++ < 10 && fs > 11 && lns.some(over)){ fs -= .5; el.style.fontSize = fs+'px'; setH(); }
}
window.addEventListener('resize', () => { if (R) fit(); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (R) fit(); });

/* ----- récitation ----- */
function mark(ok, msg){
  const v = curVerse(); if (!v) return;
  R.revealed.add(v); if (!ok) R.errors.add(v);

function normAr(s){
  return s.replace(/ى\u0670/g,'ا').replace(/[\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/[^\u0621-\u064A\s]/g,' ').replace(/\s+/g,' ').trim();
}
function lev(a,b){
  const m=a.length, n=b.length; if(!m) return n; if(!n) return m;
  let prev = Array.from({length:n+1},(_,j)=>j);
  for (let i=1;i<=m;i++){ const cur=[i]; for (let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur; }
  return prev[n];
}
function similar(a,b){ if (a===b) return true; const L=Math.max(a.length,b.length); if (L<=3) return false; return lev(a,b) <= (L>=7 ? 2 : 1); }
function expectedFrom(v0){
  const P = PAGES[R.key], out = [];
  P.lines.forEach(row => row.forEach(t => {
    if (t.w && t.v>=v0 && t.v<=R.to){ const n = normAr(t.w); if (n) out.push({ v:t.v, i:t.i, n }); }
  }));
  return out;
}
function align(exp, said){
  let ptr = 0; const res = new Array(exp.length).fill(null);
  for (const t of said){
    let f = -1;
    for (let k=ptr; k<Math.min(exp.length, ptr+4); k++){ if (similar(exp[k].n, t)){ f = k; break; } }
    if (f >= 0){ for (let k=ptr;k<f;k++) res[k] = false; res[f] = true; ptr = f+1; }
  }
  return { ptr, res };
}
function evalSpeech(text, final){
  R.heard = text;
  const h = $('#heard'); if (h) h.textContent = text || 'J’écoute…';
  if (!final) return;
  const said = normAr(text).split(' ').filter(Boolean);
  const exp = expectedFrom(R.micBase);
  const { ptr, res } = align(exp, said);
  const byV = {}; exp.forEach((x,k) => { (byV[x.v] = byV[x.v]||[]).push(k); });
  let done = 0, wrong = 0;
  Object.keys(byV).map(Number).sort((a,b)=>a-b).forEach(v => {
    const ks = byV[v], last = ks[ks.length-1];
    if (ptr > last && !R.revealed.has(v)){
      const bad = ks.filter(k => res[k] === false);
      R.revealed.add(v); done++;
      bad.forEach(k => R.bad.add(v+':'+exp[k].i));
      if (bad.length >= Math.max(1, Math.ceil(ks.length*.2))){ R.errors.add(v); wrong++; }
    }
  });
  draw();
  if (done) toast(done+' ayah'+(done>1?'s':'')+' validée'+(done>1?'s':'')+(wrong?' · '+wrong+' avec erreurs (en rouge)':' ✓'));
}
async function listen(){
  if (R.live){ stopMic(); return; }
  if (!R.hidden){ R.hidden = true; R.revealed.clear(); R.errors.clear(); R.bad.clear(); R.finishing = false; draw(); }
  if (!curVerse()) return;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR){ micDiag(); return; }
  try {
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
      const st = await navigator.mediaDevices.getUserMedia({ audio:true });
      st.getTracks().forEach(t => t.stop());
    }
  } catch(e){ micDiag(); return; }
  R.noSpeech = 0; R.live = true; startRec();
}
function startRec(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const v = curVerse();
  if (!v){ R.live = false; draw(); return; }
  R.micBase = v; R.heard = '';
  let rec;
  try { rec = new SR(); } catch(e){ R.live = false; micDiag(); return; }
  R.rec = rec; rec.lang = 'ar-SA'; rec.continuous = true; rec.interimResults = true; rec.maxAlternatives = 1;
  rec.onresult = e => {
    R.noSpeech = 0; let txt = '', fin = true;
    for (let k=0;k<e.results.length;k++){ txt += ' '+e.results[k][0].transcript; if (!e.results[k].isFinal) fin = false; }
    evalSpeech(txt.trim(), fin);
  };
  rec.onerror = e => {
    if (e.error === 'no-speech'){ R.noSpeech = (R.noSpeech||0)+1; if (R.noSpeech >= 3){ R.live = false; toast('Aucune voix détectée. Micro arrêté.'); } return; }
    if (e.error === 'aborted') return;
    R.live = false;
    if (e.error === 'network') toast('La reconnaissance vocale a besoin d’internet.');
    else if (e.error === 'language-not-supported') toast('Arabe non pris en charge sur cet appareil.');
    else micDiag();
    draw();
  };
  rec.onend = () => {
    if (R && R.live) setTimeout(() => { if (R && R.live){ try { startRec(); } catch(e){ R.live = false; draw(); } } }, 200);
    else if (R) draw();
  };
  try { rec.start(); draw(); } catch(e){ R.live = false; micDiag(); }
}
function stopMic(){
  R.live = false;
  try { R.rec && R.rec.stop(); } catch(e){}
  draw();
}
function micDiag(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const ua = navigator.userAgent || '';
  let inFrame = true; try { inFrame = window.self !== window.top; } catch(e){}
  const wv = /; wv\)|WebView/i.test(ua);
  const row = (ok,t,sub) => `<div class="lg"><span class="sw" style="color:${ok?'#1e9e4b':'#c62828'}">${ok?'✓':'✗'}</span><span>${t}<small>${sub}</small></span></div>`;
  const gum = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  openOverlay(`<h3>Diagnostic du micro</h3><p>La récitation utilise la reconnaissance vocale du navigateur.</p>
    ${row(!!SR,'Reconnaissance vocale', SR ? 'Disponible' : 'Absente. Elle manque sur Safari, Firefox et dans les applications (WebView). Utilise Chrome.')}
    ${row(!inFrame,'Page ouverte seule', inFrame ? 'Elle est dans un cadre (aperçu) : le micro y est le plus souvent bloqué.' : 'Oui')}
    ${row(!wv,'Navigateur complet', wv ? 'WebView détectée : ouvre le lien dans Chrome.' : 'Oui')}
    ${row(!!window.isSecureContext,'Connexion sécurisée', window.isSecureContext ? 'Oui' : 'Non : le micro exige https.')}
    ${row(gum,'Accès au micro', gum ? 'Disponible' : 'Indisponible dans ce contexte')}
    <div id="perm"></div>
    <div class="actions"><button class="btn alt" data-act="close">Fermer</button><button class="btn" data-act="nettest">Tester Quran.com</button></div>`);
  if (navigator.permissions && navigator.permissions.query){
    navigator.permissions.query({ name:'microphone' }).then(r => {
      const p = $('#perm'); if (!p) return;
      p.innerHTML = row(r.state==='granted','Autorisation du micro', r.state==='granted' ? 'Accordée' : r.state==='denied' ? 'Refusée : réactive-la dans les réglages du site.' : 'Pas encore demandée');
    }).catch(()=>{});
  }
}

      else S.off += (+el.dataset.d);
      save(); drawer(); draw(); break;
    case 'notif': testNotif(); break;
    case 'eye':

    case 'back': {

      if (v){ R.revealed.delete(v); R.errors.delete(v); R.finishing=false; } draw(); break; }
    case 'restart': R.revealed.clear(); R.errors.clear(); R.bad.clear(); R.finishing=false; draw(); break;
    case 'mic': listen(); break;

    case 'finish':
      R.p.stage = +el.dataset.next; R.p.last = now(); save();
      closeOverlay(); leaveSession(); setPage(R.key); toast('Révision enregistrée.'); break;
  }
});

document.addEventListener('change', e => {
  if (e.target.id === 'f-s'){
    const M = meta(e.target.value);
    const fill = (id,cur) => { let o=''; for(let i=M.min;i<=M.max;i++) o+=`<option value="${i}" ${i===cur?'selected':''}>${i}</option>`; $(id).innerHTML = o; };
    fill('#f-a', M.min); fill('#f-b', M.max);
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') $('#qlist').innerHTML = surahRows(e.target.value);
});

/* ============ Démarrage : directement sur le mushaf ============ */
setPage('tur');
</script>
